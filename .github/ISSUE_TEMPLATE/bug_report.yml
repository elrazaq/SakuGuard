name: Bug Report
description: Report a bug or financial calculation issue in SakuGuard
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. Observe '...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version & Android Version
      placeholder: e.g. SakuGuard v1.0.0, Android 14
    validations:
      required: true
